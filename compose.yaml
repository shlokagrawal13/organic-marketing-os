name: organic-marketing-os
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      POSTGRES_DB: marketing
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-marketing}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run npm run setup first}
    volumes: ["media_data:/data"]
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://marketing:${POSTGRES_PASSWORD}@postgres:5432/marketing?schema=public
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://marketing:${POSTGRES_PASSWORD}@postgres:5432/marketing?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://storage:9000
      S3_AUTO_CREATE_BUCKET: "true"
    ports: ["127.0.0.1:4000:4000"]
    command: ["npm", "run", "start:api"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
    restart: unless-stopped
  web:
    build: .
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3000:3000"]
    command: ["npm", "run", "start:web"]
    depends_on: [api]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://marketing:${POSTGRES_PASSWORD}@postgres:5432/marketing?schema=public
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "start:worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  render-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://marketing:${POSTGRES_PASSWORD}@postgres:5432/marketing?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      S3_AUTO_CREATE_BUCKET: "true"
    command: ["npm", "run", "start:render"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  media_data:
